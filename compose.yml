services:
  atmos_server:
    container_name: atmos_server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    environment:
      BACKEND_PORT: ${BACKEND_PORT}
  atmos_db:
    container_name: atmos_db
    image: nouchka/sqlite3:latest
    volumes:
      - ./server/db:/var/lib/sqlite
    environment:
      SQLITE_DATABASE: atmos.db
  atmos_client:
    container_name: atmos_client
    build:
      context: ./client/atmos_extension/
      dockerfile: Dockerfile
    volumes:
      - ./client/atmos_extension/.output:/usr/src/app/.output

