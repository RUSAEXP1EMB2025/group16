services:
  atmos_server:
    container_name: atmos_server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    environment:
      BACKEND_PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      NETFLIX_API_KEY: ${NETFLIX_API_KEY}
      REMO_TOKEN: ${REMO_TOKEN}
    volumes:
      - ./db:/workspace/db
  atmos_db:
    container_name: atmos_db
    build:
      context: ./db
      dockerfile: Dockerfile
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - ./db/data:/db/data
      - ./db/migrations:/migrations
    environment:
      DATABASE_URL: "sqlite:/db/data/atmos.db"
  atmos_extension:
    container_name: atmos_extension 
    build:
      context: ./client/atmos_extension/
      dockerfile: Dockerfile
    volumes:
      - ./client/atmos_extension/.output:/usr/src/app/.output
