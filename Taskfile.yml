version: '3'
silent: true

dotenv:
  - ".env"

includes:
  extension:
    dir: ./client/atmos_extension/
    taskfile: ./taskfile/Taskfile.extension.yml

  server:
    dir: ./server
    taskfile: ./taskfile/Taskfile.server.yml

  db:
    dir: ./db
    taskfile: ./taskfile/Taskfile.db.yml

tasks:
  default:
    desc: "全てのタスクをリスト"
    aliases:
      - list
    cmd: task -l

  dev:
    desc: "サーバーを起動"
    deps:
      - task: server:dev

  up:
    desc: "Dockerでサーバーを起動"
    deps:
      - server:up

  up-build:
    desc: "Dockerでサーバーをビルドして起動"
    deps:
      - server:up-build

  down:
    desc: "全てののサーバーをダウン"
    cmd: "docker compose down"

  gen:
    desc: "型を生成"
    deps:
      - server:gen-types
      - extension:gen-api

  setup:
    desc: "プロジェクトをセットアップ"
    deps:
      - db:setup
