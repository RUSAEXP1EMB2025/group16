version: '3'
silent: true

tasks:
  default:
    desc: "extensionのタスクを全てリスト"
    cmd: "task -l | grep extension:"

  dev:
    desc: "extensionを実行する"
    cmd: "pnpm dev"

  install:
    desc: "依存関係をインストール"
    cmd: "pnpm install --frozen-lockfile"

  add:
    desc: "ライブラリを追加"
    cmd: pnpm add {{.CLI_ARGS}}

  remove:
    desc: "ライブラリを削除"
    cmd: pnpm uninstall {{.CLI_ARGS}}

  format:
    desc: "formatを実行"
    cmd: "pnpm biome format"
    
  format-w:
    desc: "formatして書き換えを実行"
    cmd: "pnpm biome format --write"

  lint:
    desc: "lintを実行"
    cmd: "pnpm biome lint"

  lint-w:
    desc: "lintして書き換えを実行"
    cmd: "pnpm biome lint --apply"

  check:
    desc: "biome checkを実行"
    cmd: "pnpm biome check"

  check-w:
    desc: "biome checkして書き換えを実行"
    cmd: "pnpm biome check --write"

  build:
    desc: "extensionをビルド"
    cmd: docker compose run --rm atmos_extension pnpm build

  gen-api:
    desc: "serverからAPIを生成"
    cmd: pnpm openapi-zod-client http://localhost:{{.BACKEND_PORT}}/api-docs/openapi.json -o src/api/apiClient.ts 
